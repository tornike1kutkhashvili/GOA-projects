<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- displays site properly based on user's device -->

  <link rel="icon" type="image/png" sizes="32x32" href="./images/favicon-32x32.png">
  
  <title>Frontend Mentor | Calculator app</title>

  <link rel="stylesheet" href="./style.css">
</head>
<body>
<div class="calculator">

        <div class="top">
            <h2>calc</h2>

            <div class="theme">
                <span>THEME</span>
                <div class="numbers">
                    <p>1</p>
                    <p>2</p>
                    <p>3</p>
                </div>

                <div class="switch">
                    <div></div>
                </div>
            </div>
        </div>

        <div class="screen">
            <p>399,981</p>
        </div>

        <div class="buttons">

            <button>7</button>
            <button>8</button>
            <button>9</button>
            <button class="delete">DEL</button>

            <button>4</button>
            <button>5</button>
            <button>6</button>
            <button>+</button>

            <button>1</button>
            <button>2</button>
            <button>3</button>
            <button>-</button>

            <button>.</button>
            <button>0</button>
            <button>/</button>
            <button>x</button>

            <button class="reset">RESET</button>
            <button class="equal">=</button>

        </div>

    </div>
</body>
</html>

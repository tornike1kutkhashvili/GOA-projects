<!DOCTYPE html>
<html lang="en">
<head>

  <link rel="icon" type="image/png" sizes="32x32" href="./images/favicon-32x32.png">
  
  <title>Frontend Mentor | Profile card component</title>

  <link rel="stylesheet" href="./style.css">

</head>
<body>
  <div class="main">
   <img src=".//images/bg-pattern-card.svg" id="back">
   <img src=".//images/image-victor.jpg" id="avatar">

    <div class="contain">  

      <h2 id="name">Victor Crest</h2>

      <p id="age">26</p>

      <p id="country">London</p>

    </div>

    <div class="k">
      <div>
       <p class="kn">80K</p>

      </div>
      <div>
       <p class="kn">803K</p>
       <p class="ks">Likes</p>
      </div>
      <div>
       <p class="kn">1.4K</p>
      <p class="ks">Photos</p>
      </div>
   </div>

  </div>  
</body>
</html>

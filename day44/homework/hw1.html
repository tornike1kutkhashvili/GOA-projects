<!-- static — ელემენტის ჩვეულებრივი მდგომარეობაა. top, left, right, bottom არ მუშაობს.
relative — ელემენტი რჩება თავის ჩვეულებრივ ადგილას, მაგრამ შეგვიძლია top, left, right, bottom-ით გადავწიოთ.
absolute — ელემენტი ჩვეულებრივ დინებას გამოეთიშება და პოზიციონირდება უახლოესი position: relative მშობლის მიმართ.
fixed — ელემენტი ეკრანის კონკრეტულ ადგილას ფიქსირდება და სქროლის დროსაც იქ რჩება.
sticky — ელემენტი ჩვეულებრივ პოზიციაზეა, მაგრამ სქროლისას მითითებულ პოზიციაზე „ეკრობა“. -->
